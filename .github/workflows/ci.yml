name: Moodle Plugin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:${{ matrix.pgsql }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        moodle-branch: ['MOODLE_404_STABLE', 'MOODLE_405_STABLE']
        pgsql: ['14']
        database: ['pgsql']
        # Moodle 5.0 needs PHP 8.2; 5.2 and 5.3 need PHP 8.3. PostgreSQL follows each branch's
        # minimum: 14 up to 5.0, then 15, 16 and 17 (admin/environment.xml).
        include:
          - php: '8.2'
            moodle-branch: 'MOODLE_500_STABLE'
            pgsql: '14'
            database: 'pgsql'
          - php: '8.3'
            moodle-branch: 'MOODLE_500_STABLE'
            pgsql: '14'
            database: 'pgsql'
          - php: '8.3'
            moodle-branch: 'MOODLE_501_STABLE'
            pgsql: '15'
            database: 'pgsql'
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
            pgsql: '16'
            database: 'pgsql'
          - php: '8.3'
            moodle-branch: 'MOODLE_503_STABLE'
            pgsql: '17'
            database: 'pgsql'
          # PHP 8.4, supported from Moodle 5.0.
          - php: '8.4'
            moodle-branch: 'MOODLE_503_STABLE'
            pgsql: '17'
            database: 'pgsql'
          # MySQL family: the Marketplace guidelines ask for MySQL and PostgreSQL.
          - php: '8.3'
            moodle-branch: 'MOODLE_405_STABLE'
            pgsql: '14'
            database: 'mariadb'
          - php: '8.3'
            moodle-branch: 'MOODLE_503_STABLE'
            pgsql: '17'
            database: 'mariadb'

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out block_saipa (extra plugin required by Behat)
        uses: actions/checkout@v4
        with:
          repository: Krl05oP11/moodle-block_saipa
          ssh-key: ${{ secrets.BLOCK_SAIPA_DEPLOY_KEY }}
          path: extra-plugins/block_saipa

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, zip, gd, xmlrpc, soap, intl, mbstring
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --extra-plugins ./extra-plugins --db-type ${{ matrix.database }} --branch ${{ matrix.moodle-branch }}
        env:
          DB: ${{ matrix.database }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Copy/Paste Detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcpd

      - name: PHP Mess Detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker (PHPCS)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Grunt (AMD build)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit

      - name: Behat features
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome
